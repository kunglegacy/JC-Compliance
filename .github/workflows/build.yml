name: Build and Publish Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore File
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > my-upload-key.jks

      - name: Create .env Configuration File from Secrets
        env:
          ENV_RAW: ${{ secrets.ENV || secrets.DOTENV || secrets.ENV_FILE || secrets.ENV_VARS || '' }}
          S_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || '' }}
          S_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY || secrets.ANON_KEY || '' }}
          S_SECRET: ${{ secrets.SUPABASE_SECRET_KEY || '' }}
          S_API_BASE: ${{ secrets.API_BASE_URL || secrets.EXPO_PUBLIC_API_BASE_URL || secrets.VITE_API_BASE_URL || secrets.NEXT_PUBLIC_API_BASE_URL || secrets.WEB_APP_URL || '' }}
        run: |
          python3 - << 'PY'
          import os, re

          def clean_val(v: str) -> str:
              v = (v or "").replace("\r", "").strip()
              if (v.startswith('"') and v.endswith('"')) or (v.startswith("'") and v.endswith("'")):
                  v = v[1:-1].strip()
              return v

          env_map = {}
          raw = os.environ.get("ENV_RAW", "").replace("\r", "")
          for line in raw.splitlines():
              s = line.strip()
              if not s or s.startswith("#") or "=" not in s:
                  continue
              k, v = s.split("=", 1)
              k = k.strip()
              if k.startswith("export "):
                  k = k[len("export "):].strip()
              v = clean_val(v)
              if k and v:
                  env_map[k] = v

          url = clean_val(
              env_map.get("VITE_SUPABASE_URL")
              or env_map.get("SUPABASE_URL")
              or env_map.get("NEXT_PUBLIC_SUPABASE_URL")
              or os.environ.get("S_URL", "")
          )
          key = clean_val(
              env_map.get("VITE_SUPABASE_PUBLISHABLE_KEY")
              or env_map.get("SUPABASE_PUBLISHABLE_KEY")
              or env_map.get("VITE_SUPABASE_ANON_KEY")
              or env_map.get("SUPABASE_ANON_KEY")
              or env_map.get("SUPABASE_KEY")
              or env_map.get("ANON_KEY")
              or os.environ.get("S_KEY", "")
          )
          secret = clean_val(
              env_map.get("SUPABASE_SECRET_KEY")
              or os.environ.get("S_SECRET", "")
          )
          api_base = clean_val(
              env_map.get("API_BASE_URL")
              or env_map.get("EXPO_PUBLIC_API_BASE_URL")
              or env_map.get("VITE_API_BASE_URL")
              or env_map.get("NEXT_PUBLIC_API_BASE_URL")
              or env_map.get("WEB_APP_URL")
              or os.environ.get("S_API_BASE", "")
          )

          if url:
              env_map["VITE_SUPABASE_URL"] = url
              env_map["SUPABASE_URL"] = url
          if key:
              env_map["VITE_SUPABASE_PUBLISHABLE_KEY"] = key
              env_map["SUPABASE_PUBLISHABLE_KEY"] = key
              env_map["SUPABASE_ANON_KEY"] = key
          if secret:
              env_map["SUPABASE_SECRET_KEY"] = secret
          if api_base:
              env_map["API_BASE_URL"] = api_base
              env_map["EXPO_PUBLIC_API_BASE_URL"] = api_base

          content = "\n".join(f"{k}={v}" for k, v in env_map.items()) + "\n"
          for path in [".env", "app/.env"]:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          print("Generated .env keys:", list(env_map.keys()))
          print("Supabase URL configured:", bool(url) and "your-project-id" not in url)
          print("Supabase Key configured:", bool(key) and "your_key_here" not in key)
          print("API Base URL configured:", bool(api_base) and "your-web-backend" not in api_base)
          PY

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY || secrets.ANON_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY || secrets.ANON_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL || secrets.EXPO_PUBLIC_API_BASE_URL || secrets.VITE_API_BASE_URL || secrets.NEXT_PUBLIC_API_BASE_URL || secrets.WEB_APP_URL }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL || secrets.API_BASE_URL || secrets.VITE_API_BASE_URL || secrets.NEXT_PUBLIC_API_BASE_URL || secrets.WEB_APP_URL }}
        run: gradle assembleRelease

      - name: Auto-Publish to Permanent Release Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Employee Release
          files: app/build/outputs/apk/release/app-release.apk
